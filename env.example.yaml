# Machine-specific paths for scripts\*.ps1. setup_env.ps1 writes env.yaml (git-ignored) from the
# detected installs; copy this file to env.yaml to write it by hand. Flat `key: value` only.
# Relative paths are relative to the repo root; forward or back slashes both work.

# Folder holding AfterFX.exe and aerender.exe.
ae_support_dir: <After Effects install>/Support Files

# Where ae-install.ps1 copies .aex files. Must be under Adobe's MediaCore plug-ins folder
# (<Program Files>/Adobe/Common/Plug-ins/7.0/MediaCore) so AE and Premiere both load them.
plugin_dir: <Program Files>/Adobe/Common/Plug-ins/7.0/MediaCore/Probable

# Default still for ae-smoke.ps1.
smoke_image: tests/fixtures/smoke.png
